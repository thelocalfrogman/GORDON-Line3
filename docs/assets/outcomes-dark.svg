<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="The three learning outcomes: read it, question it, act on it, each with how the activity evidences it" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="1000" height="300" rx="10" fill="#0d1117"/><text x="28" y="38" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" letter-spacing="0">What the learner walks away with</text><text x="28" y="60" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">The three outcomes set by the brief, and how the activity evidences each one.</text><rect x="28" y="88" width="300" height="178" rx="9" fill="#161b22" stroke="#30363d"/><rect x="28" y="88" width="300" height="4" rx="2" fill="#5e86a8"/><circle cx="54" cy="122" r="13" fill="#5e86a8"/><text x="54" y="127" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle" letter-spacing="0">1</text><text x="76" y="127" font-size="14.5" font-weight="700" fill="#e6edf3" text-anchor="start" letter-spacing="0">Read it</text><text x="46" y="155" font-size="11.8" font-weight="400" fill="#b3bdc8" text-anchor="start" letter-spacing="0">Read a simple table and chart and say in</text><text x="46" y="170" font-size="11.8" font-weight="400" fill="#b3bdc8" text-anchor="start" letter-spacing="0">plain words what they show.</text><line x1="46" y1="189" x2="310" y2="189" stroke="#30363d"/><circle cx="50" cy="204" r="2.6" fill="#5e86a8"/><text x="60" y="208" font-size="11.2" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">Match three notes to the weeks they describe</text><circle cx="50" cy="223" r="2.6" fill="#5e86a8"/><text x="60" y="227" font-size="11.2" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">Switch one chart between four measures</text><rect x="348" y="88" width="300" height="178" rx="9" fill="#161b22" stroke="#30363d"/><rect x="348" y="88" width="300" height="4" rx="2" fill="#d99a62"/><circle cx="374" cy="122" r="13" fill="#d99a62"/><text x="374" y="127" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle" letter-spacing="0">2</text><text x="396" y="127" font-size="14.5" font-weight="700" fill="#e6edf3" text-anchor="start" letter-spacing="0">Question it</text><text x="366" y="155" font-size="11.8" font-weight="400" fill="#b3bdc8" text-anchor="start" letter-spacing="0">Spot at least two ways a table or chart</text><text x="366" y="170" font-size="11.8" font-weight="400" fill="#b3bdc8" text-anchor="start" letter-spacing="0">can give a misleading impression.</text><line x1="366" y1="189" x2="630" y2="189" stroke="#30363d"/><circle cx="370" cy="204" r="2.6" fill="#d99a62"/><text x="380" y="208" font-size="11.2" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">Build both misleading charts yourself</text><circle cx="370" cy="223" r="2.6" fill="#d99a62"/><text x="380" y="227" font-size="11.2" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">See a percentage hide a count</text><rect x="668" y="88" width="300" height="178" rx="9" fill="#161b22" stroke="#30363d"/><rect x="668" y="88" width="300" height="4" rx="2" fill="#5fc08a"/><circle cx="694" cy="122" r="13" fill="#5fc08a"/><text x="694" y="127" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle" letter-spacing="0">3</text><text x="716" y="127" font-size="14.5" font-weight="700" fill="#e6edf3" text-anchor="start" letter-spacing="0">Act on it</text><text x="686" y="155" font-size="11.8" font-weight="400" fill="#b3bdc8" text-anchor="start" letter-spacing="0">Decide what question you would ask before</text><text x="686" y="170" font-size="11.8" font-weight="400" fill="#b3bdc8" text-anchor="start" letter-spacing="0">acting on the numbers.</text><line x1="686" y1="189" x2="950" y2="189" stroke="#30363d"/><circle cx="690" cy="204" r="2.6" fill="#5fc08a"/><text x="700" y="208" font-size="11.2" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">Choose which evidence to reveal</text><circle cx="690" cy="223" r="2.6" fill="#5fc08a"/><text x="700" y="227" font-size="11.2" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">Write a note for the team meeting</text></svg>