<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Three charts of the same twelve weekly figures: the honest version from zero, and two misleading versions using a cut-off scale and a narrowed week range" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="1000" height="330" rx="10" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#16191d" text-anchor="start" letter-spacing="0">The same twelve numbers, drawn three ways</text><text x="28" y="60" font-size="12.5" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">Nothing is added or removed from the sheet. Only the scale and the window change.</text><rect x="28" y="88" width="300" height="212" rx="9" fill="#f5f6f8" stroke="#c9cdd2"/><rect x="28" y="88" width="300" height="4" rx="2" fill="#1f5f3f"/><text x="44" y="116" font-size="13" font-weight="700" fill="#16191d" text-anchor="start" letter-spacing="0">As the sheet records it</text><text x="44" y="133" font-size="11" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">All 12 weeks, scale from zero</text><line x1="50" y1="274" x2="306" y2="274" stroke="#16191d" stroke-width="1.4"/><line x1="50" y1="183.1" x2="306" y2="183.1" stroke="#7a3b12" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="54.3" y="186.4" width="12.8" height="87.6" rx="2" fill="#3d5a73"/><rect x="75.6" y="184.7" width="12.8" height="89.3" rx="2" fill="#3d5a73"/><rect x="96.9" y="185.5" width="12.8" height="88.5" rx="2" fill="#3d5a73"/><rect x="118.3" y="184.0" width="12.8" height="90.0" rx="2" fill="#3d5a73"/><rect x="139.6" y="187.1" width="12.8" height="86.9" rx="2" fill="#3d5a73"/><rect x="160.9" y="183.3" width="12.8" height="90.7" rx="2" fill="#3d5a73"/><rect x="182.3" y="207.6" width="12.8" height="66.4" rx="2" fill="#3d5a73"/><rect x="203.6" y="185.3" width="12.8" height="88.7" rx="2" fill="#3d5a73"/><rect x="224.9" y="184.4" width="12.8" height="89.6" rx="2" fill="#3d5a73"/><rect x="246.3" y="180.9" width="12.8" height="93.1" rx="2" fill="#3d5a73"/><rect x="267.6" y="181.6" width="12.8" height="92.4" rx="2" fill="#3d5a73"/><rect x="288.9" y="180.4" width="12.8" height="93.6" rx="2" fill="#3d5a73"/><text x="50" y="290" font-size="10" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">baseline 0</text><rect x="348" y="88" width="300" height="212" rx="9" fill="#f5f6f8" stroke="#c9cdd2"/><rect x="348" y="88" width="300" height="4" rx="2" fill="#7a3b12"/><text x="364" y="116" font-size="13" font-weight="700" fill="#16191d" text-anchor="start" letter-spacing="0">Trick 1 and 2 together</text><text x="364" y="133" font-size="11" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">Weeks 1 to 7, scale from 4,600</text><line x1="370" y1="274" x2="626" y2="274" stroke="#16191d" stroke-width="1.4"/><line x1="370" y1="216.9" x2="626" y2="216.9" stroke="#7a3b12" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="380.3" y="242.6" width="16.0" height="31.4" rx="2" fill="#3d5a73"/><rect x="416.9" y="229.7" width="16.0" height="44.3" rx="2" fill="#3d5a73"/><rect x="453.4" y="235.4" width="16.0" height="38.6" rx="2" fill="#3d5a73"/><rect x="490.0" y="224.0" width="16.0" height="50.0" rx="2" fill="#3d5a73"/><rect x="526.6" y="248.3" width="16.0" height="25.7" rx="2" fill="#3d5a73"/><rect x="563.1" y="218.3" width="16.0" height="55.7" rx="2" fill="#3d5a73"/><rect x="599.7" y="271" width="16.0" height="3" fill="#3d5a73" opacity=".55"/><text x="370" y="290" font-size="10" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">baseline 4,600</text><text x="626" y="290" font-size="10" font-weight="600" fill="#7a3b12" text-anchor="end" letter-spacing="0">week 7 off the bottom</text><rect x="668" y="88" width="300" height="212" rx="9" fill="#f5f6f8" stroke="#c9cdd2"/><rect x="668" y="88" width="300" height="4" rx="2" fill="#7a3b12"/><text x="684" y="116" font-size="13" font-weight="700" fill="#16191d" text-anchor="start" letter-spacing="0">The same tricks reversed</text><text x="684" y="133" font-size="11" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">Weeks 8 to 12, scale from 4,600</text><line x1="690" y1="274" x2="946" y2="274" stroke="#16191d" stroke-width="1.4"/><line x1="690" y1="216.9" x2="946" y2="216.9" stroke="#7a3b12" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="707.6" y="234.0" width="16.0" height="40.0" rx="2" fill="#3d5a73"/><rect x="758.8" y="226.9" width="16.0" height="47.1" rx="2" fill="#3d5a73"/><rect x="810.0" y="199.7" width="16.0" height="74.3" rx="2" fill="#3d5a73"/><rect x="861.2" y="205.4" width="16.0" height="68.6" rx="2" fill="#3d5a73"/><rect x="912.4" y="195.4" width="16.0" height="78.6" rx="2" fill="#3d5a73"/><text x="690" y="290" font-size="10" font-weight="400" fill="#687079" text-anchor="start" letter-spacing="0">baseline 4,600</text><text x="28" y="310" font-size="12" font-weight="400" fill="#474d54" text-anchor="start" letter-spacing="0">Cutting the bottom off the scale breaks the link between bar height and the figure. Choosing which weeks appear changes the story without changing a number.</text></svg>