<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-label="The ten-step learner journey, grouped into orientation, reading, questioning how data is shown, and deciding" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><rect width="1000" height="268" rx="10" fill="#0d1117"/><text x="28" y="38" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" letter-spacing="0">The learner journey</text><text x="28" y="60" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start" letter-spacing="0">Ten steps. Difficulty builds from reading a figure to questioning what the sheet cannot answer.</text><rect x="28.0" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="28.0" y="118" width="82" height="3.5" rx="1.8" fill="#8b949e"/><text x="38.0" y="142" font-size="11.5" font-weight="700" fill="#8b949e" text-anchor="start" letter-spacing="0.4">1</text><text x="38.0" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Welcome</text><path d="M114.0 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="125.2" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="125.2" y="118" width="82" height="3.5" rx="1.8" fill="#5e86a8"/><text x="135.2" y="142" font-size="11.5" font-weight="700" fill="#5e86a8" text-anchor="start" letter-spacing="0.4">2</text><text x="135.2" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Read the</text><text x="135.2" y="173" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">sheet</text><path d="M211.2 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="222.4" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="222.4" y="118" width="82" height="3.5" rx="1.8" fill="#5e86a8"/><text x="232.4" y="142" font-size="11.5" font-weight="700" fill="#5e86a8" text-anchor="start" letter-spacing="0.4">3</text><text x="232.4" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Find the</text><text x="232.4" y="173" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">odd week</text><path d="M308.4 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="319.6" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="319.6" y="118" width="82" height="3.5" rx="1.8" fill="#d99a62"/><text x="329.6" y="142" font-size="11.5" font-weight="700" fill="#d99a62" text-anchor="start" letter-spacing="0.4">4</text><text x="329.6" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Build two</text><text x="329.6" y="173" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">charts</text><path d="M405.6 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="416.8" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="416.8" y="118" width="82" height="3.5" rx="1.8" fill="#d99a62"/><text x="426.8" y="142" font-size="11.5" font-weight="700" fill="#d99a62" text-anchor="start" letter-spacing="0.4">5</text><text x="426.8" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Compare them</text><path d="M502.8 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="514.0" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="514.0" y="118" width="82" height="3.5" rx="1.8" fill="#d99a62"/><text x="524.0" y="142" font-size="11.5" font-weight="700" fill="#d99a62" text-anchor="start" letter-spacing="0.4">6</text><text x="524.0" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">The average</text><path d="M600.0 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="611.2" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="611.2" y="118" width="82" height="3.5" rx="1.8" fill="#d99a62"/><text x="621.2" y="142" font-size="11.5" font-weight="700" fill="#d99a62" text-anchor="start" letter-spacing="0.4">7</text><text x="621.2" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Last five</text><text x="621.2" y="173" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">weeks</text><path d="M697.2 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="708.4" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="708.4" y="118" width="82" height="3.5" rx="1.8" fill="#d99a62"/><text x="718.4" y="142" font-size="11.5" font-weight="700" fill="#d99a62" text-anchor="start" letter-spacing="0.4">8</text><text x="718.4" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Share or</text><text x="718.4" y="173" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">parts</text><path d="M794.4 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="805.6" y="118" width="82" height="60" rx="7" fill="#161b22" stroke="#30363d"/><rect x="805.6" y="118" width="82" height="3.5" rx="1.8" fill="#5fc08a"/><text x="815.6" y="142" font-size="11.5" font-weight="700" fill="#5fc08a" text-anchor="start" letter-spacing="0.4">9</text><text x="815.6" y="160" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">Write the</text><text x="815.6" y="173" font-size="11.5" font-weight="600" fill="#e6edf3" text-anchor="start" letter-spacing="0">note</text><path d="M891.6 148 l8 0" stroke="#30363d" stroke-width="1.6" stroke-linecap="round"/><rect x="902.8000000000001" y="118" width="82" height="